[data-theme="dark"]{

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;transition:background 0.2s,color 0.2s;font-size:14px;line-height:1.5}
#root{min-height:100vh}
button{cursor:pointer;font-family:inherit;border:none;background:none;color:inherit}
select,input{background:var(--s2);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-family:inherit;font-size:13px;width:100%;outline:none;appearance:none;-webkit-appearance:none;transition:border-color 0.15s}
select:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
::-webkit-scrollbar{width:5px;height:5px}

.spin{animation:spin 0.8s linear infinite;display:inline-block}

@keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.chip{display:inline-flex;align-items:center;background:var(--s2);border:1px solid var(--border);border-radius:5px;padding:2px 8px;font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin:2px;font-weight:500}

.nav-bar{background:var(--nav-bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}

// Parse DD.MM.YYYY → week number
const getWeek=(dateStr)=>{
  if(!dateStr)return null;
  const[d,m,y]=dateStr.split('.').map(Number);
  const date=new Date(y,m-1,d);
  const jan1=new Date(y,0,1);
  const week=Math.ceil(((date-jan1)/86400000+jan1.getDay()+1)/7);
  return{week,year:y,label:`W${week}`};
};

const getWeekRange=(year,week)=>{
  const jan1=new Date(year,0,1);
  const days=(week-1)*7-jan1.getDay()+1;
  const start=new Date(year,0,1+days);
  const end=new Date(start);end.setDate(end.getDate()+6);
  const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  return`${fmt(start)} — ${fmt(end)}`;
};

  const[res,setRes]=useState(null);

  useEffect(()=>{sbFetch("pricing_tariffs?select=*,pricing_services(name,code)&order=country.asc&limit=500").then(setTariffs).catch(e=>setErr(e.message)).finally(()=>setLoading(false));},[]);

  const countries=useMemo(()=>[...new Set(tariffs.map(t=>t.country).filter(Boolean))].sort(),[tariffs]);

  const channels=useMemo(()=>[...new Set(tariffs.map(t=>t.delivery_type).filter(Boolean))].sort(),[tariffs]);

  const filtered=useMemo(()=>tariffs.filter(t=>(!fC||t.country===fC)&&(!fP||t.product_type===fP)&&(!fCh||t.delivery_type===fCh)),[tariffs,fC,fP,fCh]);

        h(StatCard,{label:"Стран",value:loading?"…":countries.length,icon:"🌍",color:"#2563eb"}),
        h(StatCard,{label:"Продуктов",value:loading?"…":products.length,icon:"📦",color:"#059669"}),
        h(StatCard,{label:"От, $/кг",value:loading?"…":minPx!=null?fmt$(minPx):"—",icon:"💰",color:"#d97706"})
      ),
      h('div',{style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:14,padding:24,marginBottom:24,boxShadow:"var(--shadow)"}},
        h('h2',{style:{fontSize:17,fontWeight:600,marginBottom:4}},"Калькулятор стоимости"),
        h('p',{style:{fontSize:13,color:"var(--muted)",marginBottom:20}},"Подберём тариф по направлению и весу"),
        h('div',{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:12,marginBottom:16}},
          h('div',null,h(Sel,{label:"Страна",value:cC,onChange:setCC,options:countries,placeholder:"Выберите..."})),
          h('div',null,h(Inp,{label:"Вес, кг",value:cW,onChange:setCW,placeholder:"0.5"})),
          h('div',null,h(Inp,{label:"Отправлений",value:cQ,onChange:setCQ,placeholder:"1"})),
          h('div',null,h(Sel,{label:"Продукт",value:cP,onChange:setCP,options:products})),
          h('div',null,h(Sel,{label:"Канал",value:cCh,onChange:setCCh,options:channels}))
        ),
        h('button',{onClick:calc,className:"btn-primary"},"Рассчитать →"),
        res&&h('div',{style:{marginTop:18}},
          res.err?h('p',{style:{color:"var(--muted)",fontSize:13,padding:"12px 0"}},res.err):
          h('div',{style:{overflowX:"auto",borderRadius:10,border:"1px solid var(--border)"}},
            h('table',null,
              h('thead',null,h('tr',null,...["Сервис","Продукт","Диапазон","$/кг","$/шт","Итого"].map(hh=>h('th',{key:hh},hh)))),
              h('tbody',null,...res.map((r,i)=>h('tr',{key:i},

              )))
            )
          )
        )
      ),
      h('div',{style:{display:"flex",gap:10,marginBottom:12,flexWrap:"wrap",alignItems:"flex-end"}},
        h('div',{style:{flex:"1 1 130px"}},h(Sel,{label:"Страна",value:fC,onChange:setFC,options:countries})),
        h('div',{style:{flex:"1 1 130px"}},h(Sel,{label:"Продукт",value:fP,onChange:setFP,options:products})),
        h('div',{style:{flex:"1 1 130px"}},h(Sel,{label:"Канал",value:fCh,onChange:setFCh,options:channels})),
        (fC||fP||fCh)&&h('button',{onClick:()=>{setFC("");setFP("");setFCh("");},className:"btn-ghost",style:{alignSelf:"flex-end"}},"Сбросить")
      ),
      h('div',{style:{fontSize:12,color:"var(--muted)",marginBottom:10}},`Найдено ${filtered.length} из ${tariffs.length} тарифов`),
      loading?h(Spinner):h('div',{style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:14,overflow:"hidden",boxShadow:"var(--shadow)"}},

            ),

              h('table',null,
                h('thead',null,h('tr',null,...["Продукт","Канал","Диапазон","От кг","До кг","$/кг","$/шт","Валюта","Статус"].map(hh=>h('th',{key:hh},hh)))),
                h('tbody',null,...items.map(t=>h('tr',{key:t.id||Math.random()},
                  h('td',null,t.product_type||"—"),h('td',{style:{color:"var(--muted)"}},t.delivery_type||"—"),
                  h('td',{style:{fontFamily:"monospace",fontSize:11}},t.weight_range||"—"),
                  h('td',{style:{fontFamily:"monospace"}},t.weight_from_kg??"-"),
                  h('td',{style:{fontFamily:"monospace"}},t.weight_to_kg??"-"),

const CostingPage=({setPage})=>{
  const[data,setData]=useState([]);
  const[loading,setLoading]=useState(true);
  const[err,setErr]=useState(null);
  const[client,setClient]=useState("Cainiao");
  const[activeStage,setActiveStage]=useState("");
  const[sort,setSort]=useState("name");

  useEffect(()=>{
    setLoading(true);setData([]);setErr(null);
    sbFetch(`costing?select=*&client_id=eq.${CLIENT_IDS[client]}&limit=2000`)
      .then(setData).catch(e=>setErr(e.message)).finally(()=>setLoading(false));
  },[client]);

  const services=useMemo(()=>{
    const map={};
    data.forEach(row=>{
      const k=row.service_name_expenses;if(!k)return;
      if(!map[k])map[k]={name:k,unit:row.measurement_unit,rates:[],routes:new Set(),contractors:new Set(),stage:getStage(k),currency:"USD"};
      if(row.rate_original!=null&&row.rate_original>0){map[k].rates.push(row.rate_original);map[k].currency=row.rate_currency||"USD";}
      if(row.route_code)map[k].routes.add(row.route_code);
      if(row.contractor_name)map[k].contractors.add(row.contractor_name);
    });
    return Object.values(map).map(s=>{
      const r=s.rates;
      return{...s,avg:r.length?r.reduce((a,b)=>a+b,0)/r.length:0,min:r.length?Math.min(...r):0,max:r.length?Math.max(...r):0,routes:[...s.routes].sort(),contractors:[...s.contractors]};
    });
  },[data]);

  const filtered=useMemo(()=>activeStage?services.filter(s=>s.stage===activeStage):services,[services,activeStage]);
  const sorted=useMemo(()=>[...filtered].sort((a,b)=>{
    if(sort==="asc")return a.avg-b.avg;if(sort==="desc")return b.avg-a.avg;
    if(sort==="rows")return b.routes.length-a.routes.length;
    return a.name.localeCompare(b.name,"ru");
  }),[filtered,sort]);
  const totalRoutes=useMemo(()=>services.reduce((s,x)=>s+x.routes.length,0),[services]);
  const uniqueContractors=useMemo(()=>new Set(services.flatMap(s=>s.contractors)).size,[services]);
  const sumAvg=useMemo(()=>services.reduce((s,x)=>s+x.avg,0),[services]);
  const stageCounts=useMemo(()=>{const c={};services.forEach(s=>{c[s.stage]=(c[s.stage]||0)+s.routes.length;});return c;},[services]);
  const byStage=useMemo(()=>{const g={};sorted.forEach(s=>{if(!g[s.stage])g[s.stage]=[];g[s.stage].push(s);});return g;},[sorted]);
  const visibleStages=activeStage?[STAGES.find(s=>s.id===activeStage)].filter(Boolean):STAGES.filter(s=>byStage[s.id]);

  return h('div',{style:{background:"var(--bg)",minHeight:"100vh"}},
    h(Nav,{page:"costing",setPage}),
    h('div',{style:{maxWidth:1200,margin:"0 auto",padding:"32px 24px"}},
      h('div',{style:{marginBottom:24}},
        h('div',{style:{fontSize:12,color:"var(--muted)",marginBottom:4}},"Внутренний отчёт"),
        h('h1',{style:{fontSize:28,fontWeight:700,color:"var(--text)",letterSpacing:"-0.02em"}},"Costing")
      ),
      err&&h(ErrBox,{msg:err}),
      h(ClientTabs,{client,setClient}),
      loading?h(Spinner):h(Fragment,null,
        h('div',{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:12,marginBottom:24}},
          h(StatCard,{label:"Услуг",value:services.length,icon:"🔧",color:"#7c3aed"}),
          h(StatCard,{label:"Подрядчиков",value:uniqueContractors,icon:"🏢",color:"#2563eb"}),
          h(StatCard,{label:"Тарифных строк",value:totalRoutes,icon:"📊",color:"#059669"}),
          h(StatCard,{label:"∑ ср. кост, $",value:sumAvg.toFixed(2),icon:"💵",color:"#d97706"})
        ),
        h('div',{style:{display:"flex",gap:8,marginBottom:20,flexWrap:"wrap",alignItems:"center"}},
          h('div',{style:{display:"flex",gap:6,flex:1,flexWrap:"wrap"}},
            h('button',{onClick:()=>setActiveStage(""),className:`filter-chip ${!activeStage?"active":""}`},"Все"),
            ...STAGES.filter(s=>stageCounts[s.id]).map(s=>h('button',{key:s.id,onClick:()=>setActiveStage(activeStage===s.id?"":s.id),className:`filter-chip ${activeStage===s.id?"active":""}`},
              s.id,h('span',{style:{opacity:0.8,fontSize:11}},stageCounts[s.id])
            ))
          ),
          h('div',{style:{display:"flex",gap:2}},
            ...[["name","По названию"],["desc","Дороже →"],["asc","Дешевле →"],["rows","Больше строк"]].map(([v,l])=>h('button',{key:v,onClick:()=>setSort(v),className:`sort-btn ${sort===v?"active":""}`},l))
          )
        ),
        h('div',{style:{fontSize:12,color:"var(--muted)",marginBottom:16}},`${services.length} услуг · ${totalRoutes} строк`),
        ...visibleStages.map(stage=>{
          const list=byStage[stage.id]||[];
          if(!list.length)return null;
          return h('div',{key:stage.id,style:{marginBottom:32}},
            h('div',{style:{marginBottom:14}},
              h('div',{style:{display:"flex",alignItems:"center",gap:10,marginBottom:4}},
                h('h2',{style:{fontSize:17,fontWeight:700}},stage.id),
                h('span',{style:{color:"var(--muted)"}},"·"),
                h('span',{style:{fontSize:13,color:"var(--muted)"}},stage.desc)
              ),
              h('div',{style:{fontSize:12,color:"var(--muted)"}},`${list.length} услуг · ${list.reduce((s,x)=>s+x.routes.length,0)} строк`)
            ),
            ...list.map(svc=>h(ServiceCard,{key:svc.name,svc}))
          );
        })
      )
    ),
    h('footer',{style:{borderTop:"1px solid var(--border)",padding:"16px 24px",textAlign:"center",fontSize:12,color:"var(--muted)",marginTop:32}},"© 2026 Antria Group")
  );
};

      .then(setData).catch(e=>setErr(e.message)).finally(()=>setLoading(false));
  },[client]);

  // Aggregate from pre-aggregated view (already weekly)
  const weeklyData=useMemo(()=>{
    if(!data.length)return{weeks:[],byWeek:{},countries:[],services:[],totals:{}};
    const byWeek={};
    let totalPcs=0,totalKg=0;
    const countries=new Set(),services=new Set();

    data.forEach(row=>{
      const k=`W${row.week}`;
      if(!byWeek[k])byWeek[k]={label:k,week:row.week,year:row.year,pcs:0,kg:0};
      const pcs=Number(row.pcs)||0;
      const kg=parseFloat(row.kg)||0;
      byWeek[k].pcs+=pcs;
      byWeek[k].kg+=kg;
      const c=row.consigneecountry||"?";
      byWeek[k][`c_${c}`]=(byWeek[k][`c_${c}`]||0)+pcs;
      byWeek[k][`ck_${c}`]=(byWeek[k][`ck_${c}`]||0)+kg;
      countries.add(c);
      const s=row.service||"?";
      byWeek[k][`s_${s}`]=(byWeek[k][`s_${s}`]||0)+pcs;
      byWeek[k][`sk_${s}`]=(byWeek[k][`sk_${s}`]||0)+kg;
      services.add(s);
      totalPcs+=pcs;totalKg+=kg;
    });

    const weeks=Object.values(byWeek).sort((a,b)=>a.week-b.week);
    const avgWeight=totalPcs>0?(totalKg/totalPcs)*1000:0;
    return{weeks,byWeek,countries:[...countries].sort(),services:[...services].sort(),totals:{pcs:totalPcs,kg:totalKg,avgWeight,weeks:weeks.length}};
  },[data]);

  const{weeks,countries,services,totals}=weeklyData;

  // Dual-axis chart data
  const mainChartData=useMemo(()=>weeks.map(w=>({label:w.label,Штуки:w.pcs,Килограммы:parseFloat(w.kg.toFixed(1))})),[weeks]);

  // Stacked chart data
  const stackedData=useMemo(()=>{
    if(breakdown==="country"){
      return weeks.map(w=>({
        label:w.label,
        ...Object.fromEntries(countries.map(c=>[c,metric==="kg"?parseFloat((w[`ck_${c}`]||0).toFixed(1)):w[`c_${c}`]||0]))
      }));
    } else {
      return weeks.map(w=>({
        label:w.label,
        ...Object.fromEntries(services.map(s=>[s,metric==="kg"?parseFloat((w[`sk_${s}`]||0).toFixed(1)):w[`s_${s}`]||0]))
      }));
    }
  },[weeks,countries,services,breakdown,metric]);

  const stackKeys=breakdown==="country"?countries:services;
  const stackColors=breakdown==="country"?COUNTRY_COLORS:SERVICE_COLORS;

    h(Nav,{page:"volumes",setPage}),
    h('div',{style:{maxWidth:1280,margin:"0 auto",padding:"32px 24px"}},

          h('span',{style:{fontSize:13,color:"var(--muted)",fontWeight:400,marginLeft:8}},loading?"…":`Динамика по штукам и кг · ${weeklyData.totals.weeks||0} нед.`)

      loading?h(Spinner):h(Fragment,null,
        // Stat cards
        h('div',{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:12,marginBottom:28}},

          h(StatCard,{label:"Σ Килограмм",value:`${((totals.kg||0)/1000).toFixed(2)} т`,sub:`${(totals.kg||0).toFixed(1)} кг`,icon:"⚖️",color:"#7c3aed"}),
          h(StatCard,{label:"Средний вес посылки",value:`${(totals.avgWeight||0).toFixed(0)} г`,sub:"кг × 1000 / шт",icon:"📮",color:"#7c3aed"}),

        ),

        // Main chart: pcs bars + kg line
        h('div',{className:"chart-wrap"},
          h('div',{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}},
            h('div',null,
              h('h2',{style:{fontSize:17,fontWeight:600}},"Динамика объёма · по неделям"),

              h(CartesianGrid,{strokeDasharray:"3 3",stroke:"var(--border)",vertical:false}),
              h(XAxis,{dataKey:"label",tick:{fill:"var(--muted)",fontSize:12},axisLine:{stroke:"var(--border)"},tickLine:false}),
              h(YAxis,{yAxisId:"pcs",tick:{fill:"var(--muted)",fontSize:11},axisLine:false,tickLine:false,tickFormatter:fmtK}),
              h(YAxis,{yAxisId:"kg",orientation:"right",tick:{fill:"var(--orange)",fontSize:11},axisLine:false,tickLine:false,tickFormatter:v=>`${(v/1000).toFixed(1)}т`}),

              h(Line,{yAxisId:"kg",dataKey:"Килограммы",stroke:"var(--orange)",strokeWidth:2.5,dot:{fill:"var(--orange)",r:3,strokeWidth:0},activeDot:{r:5}})
            )
          )
        ),

        // Stacked breakdown chart
        h('div',{className:"chart-wrap"},
          h('div',{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16,flexWrap:"wrap",gap:12}},
            h('div',null,
              h('h2',{style:{fontSize:17,fontWeight:600}},
                `Разбивка по неделям · ${metric==="kg"?"Килограммы":"Штуки"} по ${breakdown==="country"?"странам":"сервисам"}`
              )
            ),
            h('div',{style:{display:"flex",gap:12,flexWrap:"wrap"}},
              // Metric toggle
              h('div',{style:{display:"flex",alignItems:"center",gap:6}},

                ...[["pcs","Штуки"],["kg","Килограммы"]].map(([v,l])=>h('button',{key:v,onClick:()=>setMetric(v),className:`metric-chip ${metric===v?"active":""}`},l))

// Постраничная загрузка: REST API Supabase отдаёт максимум ~1000 строк за запрос,
// поэтому тянем страницами по 1000 (offset+limit), пока строки не закончатся.
const sbFetchAll=async(base)=>{
  let out=[],offset=0;
  for(let i=0;i<5000;i++){
    const page=await sbFetch(`${base}&offset=${offset}&limit=1000`);
    if(!page||!page.length)break;
    out=out.concat(page);
    offset+=page.length;
  }
  return out;
};

// ── REVENUE (Выручка) ──────────────────────────────────────────
// Источник: revenue_batch_cache — выручка по партии × стране × сервису × типу продукта.
//   Итого    = total_revenue
//   По весу   = price_per_kg  × total_weight_kg
//   По штукам = price_per_item × total_shipments
const REV_MONTHS=["","Янв","Фев","Мар","Апр","Май","Июн","Июл","Авг","Сен","Окт","Ноя","Дек"];
const REV_YEARS=[2026,2025];
const REV_GRANS=[["year","Year"],["quarter","Quarter"],["month","Monthly"],["week","Weekly"]];
const REV_METRICS=[["revenue","Итого"],["linehaul","По весу"],["lastmile","По штукам"]];
const REV_METRIC_LABEL={revenue:"Итого",linehaul:"По весу (за кг)",lastmile:"По штукам (за шт)"};

// ISO-неделя по дате "YYYY-MM-DD"
const revIsoWeek=(s)=>{const d=new Date(s+"T00:00:00Z");const day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);const ys=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil((((d-ys)/86400000)+1)/7);};

const RevTooltip=({active,payload,label,metric})=>{
  if(!active||!payload?.length)return null;
  const total=payload.reduce((s,p)=>s+(Number(p.value)||0),0);
  const row=payload[0]?.payload||{};
  const extra=(name)=>{
    if(metric==="lastmile"){const n=row["__pcs_"+name];return n?` · ${fmtK(n)} шт`:"";}
    if(metric==="linehaul"){const n=row["__kg_"+name];return n?` · ${fmtK(n)} кг`:"";}
    return "";
  };
  let tPcs=0,tKg=0;payload.forEach(p=>{tPcs+=Number(row["__pcs_"+p.name])||0;tKg+=Number(row["__kg_"+p.name])||0;});
  const totalExtra=metric==="lastmile"?` · ${fmtK(tPcs)} шт`:metric==="linehaul"?` · ${fmtK(tKg)} кг`:"";
  return h('div',{className:"tooltip-box"},
    h('div',{style:{fontWeight:600,marginBottom:6,color:"var(--text)"}},label),
    ...payload.filter(p=>p.value>0).map((p,i)=>h('div',{key:i,style:{color:p.color,marginBottom:2}},`${p.name} : $${fmtK(p.value)}${extra(p.name)}`)),
    h('div',{style:{marginTop:6,paddingTop:6,borderTop:"1px solid var(--border)",fontWeight:600,color:"var(--text)"}},`Σ : $${fmtK(total)}${totalExtra}`)
  );
};

// Небольшой select для фильтров
const RevSel=({label,value,onChange,options,disabled})=>h('div',{style:{display:"flex",alignItems:"center",gap:6}},
  h('span',{style:{fontSize:12,color:"var(--muted)",fontWeight:600}},label),
  h('select',{value,onChange:e=>onChange(e.target.value),disabled,
    style:{padding:"6px 10px",borderRadius:8,fontSize:13,color:"var(--text)",background:"var(--surface)",border:"1px solid var(--border)",cursor:disabled?"not-allowed":"pointer",opacity:disabled?0.5:1,maxWidth:200}},
    h('option',{value:""},"Все"),
    ...options.map(o=>h('option',{key:o,value:o},o))
  )
);

const RevenuePage=({setPage})=>{
  const[year,setYear]=useState(2026);
  const[gran,setGran]=useState("quarter");      // year | quarter | month | week
  const[metric,setMetric]=useState("revenue");  // revenue | linehaul | lastmile
  const[client,setClient]=useState("");
  const[fCountry,setFCountry]=useState("");
  const[fService,setFService]=useState("");
  const[fDanger,setFDanger]=useState("");        // product_type
  const[fBatch,setFBatch]=useState("");
  const[fMonth,setFMonth]=useState(0);           // 0 = все
  const[selPeriod,setSelPeriod]=useState(null);  // выбранный период по клику на графике
  const[rows,setRows]=useState([]);              // revenue_batch_cache
  const[batchRows,setBatchRows]=useState([]);    // pl_batch_cache (батч → дата/неделя)
  const[loading,setLoading]=useState(true);
  const[err,setErr]=useState(null);

  useEffect(()=>{
    setLoading(true);setErr(null);setRows([]);setBatchRows([]);
    Promise.all([
      // период и год берём отсюда (авторитетно, как в P&L)
      sbFetchAll(`pl_batch_cache?select=batch,client_code,year,week_num,batch_date&year=eq.${year}`),
      // выручка по партии × стране × сервису × типу (все строки, постранично)
      sbFetchAll(`revenue_batch_cache?select=client,batch,country,service,product_type,price_per_kg,price_per_item,total_weight_kg,total_shipments,total_revenue`)
    ])
      .then(([b,r])=>{setBatchRows(b||[]);setRows(r||[]);})
      .catch(e=>setErr(e.message))
      .finally(()=>setLoading(false));
  },[year]);

  // Список клиентов + дефолт (Cainiao, если есть)
  const clients=useMemo(()=>[...new Set(rows.map(r=>r.client).filter(Boolean))].sort(),[rows]);
  useEffect(()=>{if(clients.length&&!clients.includes(client))setClient(clients.find(c=>/cai/i.test(c))||clients[0]);},[clients]);

  const{chartData,countries,allCountries,services,dangers,batches,totals}=useMemo(()=>{
    // partия → дата/неделя (из pl_batch_cache, только за выбранный год)
    const plCodeFor=(c)=>c==="cainiao"?"cainiao":"uzum_cb";
    const batchInfo={};
    batchRows.forEach(b=>{batchInfo[`${b.client_code}:${b.batch}`]={date:b.batch_date,week:b.week_num};});

    const rowsC=rows.filter(r=>!client||r.client===client);
    // только строки, чья партия есть в выбранном году (это и есть фильтр по году)
    const info4=(r)=>batchInfo[`${plCodeFor(r.client)}:${r.batch}`];
    const rowsY=rowsC.filter(r=>!!info4(r));

    const allCountries=[...new Set(rowsY.map(r=>r.country).filter(Boolean))].sort();
    const services=[...new Set(rowsY.map(r=>r.service).filter(Boolean))].sort();
    const dangers=[...new Set(rowsY.map(r=>r.product_type).filter(Boolean))].sort();
    const batches=[...new Set(rowsY.map(r=>r.batch!=null?String(r.batch):null).filter(Boolean))].sort((a,b)=>Number(a)-Number(b));

    const mv=(r)=>metric==="linehaul"?(Number(r.price_per_kg)||0)*(Number(r.total_weight_kg)||0)
      :metric==="lastmile"?(Number(r.price_per_item)||0)*(Number(r.total_shipments)||0)
      :Number(r.total_revenue)||0;
    const periodKey=(info)=>{
      const mo=info.date?Number(String(info.date).slice(5,7)):0;
      if(gran==="week"){const w=info.week||0;return{key:"W"+w,label:"W"+w,order:w};}
      if(gran==="month")return{key:"M"+mo,label:REV_MONTHS[mo]||"M"+mo,order:mo};
      if(gran==="quarter"){const q=Math.ceil(mo/3)||0;return{key:"Q"+q,label:"Q"+q,order:q};}
      return{key:"Y"+year,label:String(year),order:0};
    };

    const buckets={};
    rowsY.forEach(r=>{
      const info=info4(r);
      const mo=info.date?Number(String(info.date).slice(5,7)):0;
      if(fMonth&&mo!==fMonth)return;
      if(fService&&r.service!==fService)return;
      if(fDanger&&r.product_type!==fDanger)return;
      if(fBatch&&String(r.batch)!==fBatch)return;
      const c=r.country||"?";
      if(fCountry&&c!==fCountry)return;
      const{key,label,order}=periodKey(info);
      if(!buckets[key])buckets[key]={key,label,order,byCountry:{},vol:{}};
      buckets[key].byCountry[c]=(buckets[key].byCountry[c]||0)+mv(r);
      if(!buckets[key].vol[c])buckets[key].vol[c]={pcs:0,kg:0};
      buckets[key].vol[c].pcs+=Number(r.total_shipments)||0;
      buckets[key].vol[c].kg+=Number(r.total_weight_kg)||0;
    });

    const countries=fCountry?[fCountry]:allCountries;
    const chartData=Object.values(buckets).sort((a,b)=>a.order-b.order).map(b=>{
      const row={label:b.label,_total:0};
      countries.forEach(c=>{
        row[c]=Math.round(b.byCountry[c]||0);row._total+=row[c];
        const v=b.vol[c]||{pcs:0,kg:0};
        row["__pcs_"+c]=Math.round(v.pcs);row["__kg_"+c]=Math.round(v.kg);
      });
      return row;
    });
    let totalPcs=0,totalKg=0;
    chartData.forEach(r=>countries.forEach(c=>{totalPcs+=r["__pcs_"+c]||0;totalKg+=r["__kg_"+c]||0;}));
    const totalRev=chartData.reduce((s,r)=>s+r._total,0);
    return{chartData,countries,allCountries,services,dangers,batches,totals:{rev:totalRev,pcs:totalPcs,kg:totalKg,perKg:totalKg>0?totalRev/totalKg:0,perPcs:totalPcs>0?totalRev/totalPcs:0}};
  },[rows,batchRows,client,gran,year,metric,fCountry,fService,fDanger,fBatch,fMonth]);

  const noData=!loading&&!err&&chartData.length===0;

  // KPI: если выбран период (клик по графику) — считаем только по нему, иначе по всему году
  const kpi=useMemo(()=>{
    const src=selPeriod?chartData.filter(r=>r.label===selPeriod):chartData;
    let rev=0,pcs=0,kg=0;
    src.forEach(r=>{rev+=r._total||0;countries.forEach(c=>{pcs+=r["__pcs_"+c]||0;kg+=r["__kg_"+c]||0;});});
    return{rev,pcs,kg,perKg:kg>0?rev/kg:0,perPcs:pcs>0?rev/pcs:0};
  },[chartData,countries,selPeriod]);

  // сбрасываем выбранный период при смене разреза/фильтров (метки периодов меняются)
  useEffect(()=>{setSelPeriod(null);},[gran,year,client,fCountry,fService,fDanger,fBatch,fMonth]);

  // select-группа для фильтр-панели
  const gSel=(label,value,onChange,opts)=>h('div',{className:"rev-group"},
    h('span',{className:"rev-glabel"},label),
    h('div',{className:"rev-select"},h('select',{value,onChange:e=>onChange(e.target.value)},
      h('option',{value:""},"Все"),...opts.map(o=>h('option',{key:o,value:o},o))))
  );
  const anyFilter=fCountry||fService||fDanger||fBatch||fMonth;
  const resetFilters=()=>{setFCountry("");setFService("");setFDanger("");setFBatch("");setFMonth(0);};
  const onChartClick=(e)=>{const l=e&&e.activeLabel;if(l)setSelPeriod(p=>p===l?null:l);};

  return h('div',{style:{background:"var(--bg)",minHeight:"100vh"}},
    h(Nav,{page:"revenue",setPage}),
    h('div',{style:{maxWidth:1280,margin:"0 auto",padding:"32px 24px"}},
      h('div',{style:{marginBottom:24}},
        h('div',{style:{fontSize:12,color:"var(--muted)",marginBottom:4}},`Выручка по странам и периодам${client?" · "+client:""}`),
        h('h1',{style:{fontSize:28,fontWeight:700,color:"var(--text)",letterSpacing:"-0.02em",display:"flex",alignItems:"center",gap:10}},
          h('span',{style:{fontSize:20}},"💰"),"Выручка",
          h('span',{style:{fontSize:13,color:"var(--muted)",fontWeight:400,marginLeft:8}},loading?"…":`${year} · ${chartData.length} периодов`)
        )
      ),
      err&&h(ErrBox,{msg:err}),
      noData&&h(ErrBox,{msg:`Нет данных за ${year}. Проверь, что pl_batch_cache и revenue_batch_cache заполнены за этот год.`}),
      // ── Панель фильтров ────────────────────────────────────────────
      h('div',{className:"rev-bar"},
        h('div',{className:"rev-row"},
          h('div',{className:"rev-group"},
            h('span',{className:"rev-glabel"},"Год"),
            h('div',{className:"rev-seg accent"},...REV_YEARS.map(y=>h('button',{key:y,className:year===y?"on":"",onClick:()=>setYear(y)},String(y))))
          ),
          h('div',{className:"rev-group"},
            h('span',{className:"rev-glabel"},"Период"),
            h('div',{className:"rev-seg"},...REV_GRANS.map(([v,l])=>h('button',{key:v,className:gran===v?"on":"",onClick:()=>setGran(v)},l)))
          ),
          clients.length>1&&h('div',{className:"rev-group"},
            h('span',{className:"rev-glabel"},"Клиент"),
            h('div',{className:"rev-select"},h('select',{value:client,onChange:e=>setClient(e.target.value)},...clients.map(c=>h('option',{key:c,value:c},c))))
          )
        ),
        h('div',{className:"rev-row"},
          h('div',{className:"rev-group"},
            h('span',{className:"rev-glabel"},"Метрика"),
            h('div',{className:"rev-seg accent"},...REV_METRICS.map(([v,l])=>h('button',{key:v,className:metric===v?"on":"",onClick:()=>setMetric(v)},l)))
          ),
          h('div',{className:"rev-group"},
            h('span',{className:"rev-glabel"},"Страна"),
            h('div',{style:{display:"flex",gap:6,flexWrap:"wrap"}},
              h('button',{className:`rev-pill ${fCountry===""?"on":""}`,onClick:()=>setFCountry("")},"Все"),
              ...allCountries.map(c=>h('button',{key:c,className:`rev-pill ${fCountry===c?"on":""}`,onClick:()=>setFCountry(c)},c))
            )
          )
        ),
        h('div',{className:"rev-row"},
          gSel("Сервис",fService,setFService,services),
          gSel("danger_type",fDanger,setFDanger,dangers),
          gSel("Партия",fBatch,setFBatch,batches),
          h('div',{className:"rev-group"},

          h(StatCard,{label:"Отправлено шт",value:fmtK(kpi.pcs),sub:"кол-во (шт)",icon:"📦",color:"#7c3aed"}),
          h(StatCard,{label:"Отправлено кг",value:fmtK(kpi.kg),sub:"вес (кг)",icon:"⚖️",color:"#7c3aed"}),
          h(StatCard,{label:"Средний тариф",value:`$${kpi.perKg.toFixed(2)}`,sub:`за кг · $${kpi.perPcs.toFixed(2)} за шт`,icon:"🏷️",color:"#7c3aed"})
        ),
        h('div',{className:"chart-wrap"},
          h('div',{style:{marginBottom:20,display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:8}},
            h('div',null,

              h('p',{style:{fontSize:12,color:"var(--muted)",marginTop:2}},`Накопительно по ${gran==="quarter"?"кварталам":gran==="month"?"месяцам":gran==="week"?"неделям":"году"}${fMonth?" · "+REV_MONTHS[fMonth]:""}`)
            ),
            h('span',{style:{fontSize:11,color:"var(--muted)",fontStyle:"italic"}},"💡 кликни по периоду — KPI пересчитаются")
          ),

              h(CartesianGrid,{strokeDasharray:"3 3",stroke:"var(--border)",vertical:false}),
              h(XAxis,{dataKey:"label",tick:{fill:"var(--muted)",fontSize:12},axisLine:{stroke:"var(--border)"},tickLine:false}),
              h(YAxis,{tick:{fill:"var(--muted)",fontSize:11},axisLine:false,tickLine:false,tickFormatter:fmtK}),
              h(Tooltip,{content:h(props=>h(RevTooltip,{...props,metric}))}),

// ── UPLOAD ─────────────────────────────────────────────────────
const UploadPage=({setPage})=>{
  const[tab,setTab]=useState("ordercode"); // ordercode | batches
  const[client,setClient]=useState("Cainiao");
  const[batchType,setBatchType]=useState("");
  const[batchNum,setBatchNum]=useState("");
  const[date,setDate]=useState("");
  const[file,setFile]=useState(null);
  const[preview,setPreview]=useState([]);
  const[status,setStatus]=useState(null); // null | loading | done | error
  const[log,setLog]=useState([]);
  const[dragOver,setDragOver]=useState(false);

  // Batches form state
  const[bFrom,setBFrom]=useState("CAINIAO");
  const[bGross,setBGross]=useState("");
  const[bCharge,setBCharge]=useState("");
  const[bAwb,setBAwb]=useState("");
  const[bAgent,setBAgent]=useState("SILKWAY");
  const[bYear,setBYear]=useState(new Date().getFullYear().toString());

  const reset=()=>{
    setFile(null);setPreview([]);setStatus(null);setLog([]);
    setBatchNum("");setDate("");setBatchType("");
  };

  // Parse xlsx/csv in browser using FileReader
  const parseFile=useCallback((f)=>{
    if(!f)return;
    setFile(f);setStatus(null);setLog([]);setPreview([]);
    const reader=new FileReader();
    reader.onload=async(e)=>{
      try{
        // Dynamically import SheetJS
        const XLSX=await import('https://esm.sh/xlsx@0.18.5');
        const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
        if(!rows.length){setStatus("error");setLog(["Файл пустой"]);return;}
        // Find header row
        const headerIdx=rows.findIndex(r=>r.some&&r.some(c=>String(c).toLowerCase().includes('itemid')||String(c).toLowerCase().includes('ordercode')));
        if(headerIdx<0){setStatus("error");setLog(["Не найден заголовок (нет колонки itemid)"]);return;}
        const headers=rows[headerIdx].map(h=>String(h).trim().toLowerCase());
        const dataRows=rows.slice(headerIdx+1).filter(r=>r.some(c=>c!==""));
        const getCol=(row,name)=>{
          const idx=headers.indexOf(name);
          return idx>=0?row[idx]:"";
        };
        // Build preview (first 5)
        const prev=dataRows.slice(0,5).map(r=>({
          shipment:getCol(r,'itemid'),
          bigbags:getCol(r,'cartonid'),
          big_bag_id:getCol(r,'ordercode'),
          consigneecountry:getCol(r,'consigneecountry'),
          service:getCol(r,'service'),
          weight_g:getCol(r,'packageweight(g)'),
          danger_type:getCol(r,'danger_type'),
        }));
        setPreview(prev);
        setLog([`Найдено ${dataRows.length} строк`]);
      }catch(err){
        setStatus("error");setLog([`Ошибка парсинга: ${err.message}`]);
      }
    };
    reader.readAsArrayBuffer(f);
  },[]);

  const handleDrop=useCallback((e)=>{
    e.preventDefault();setDragOver(false);
    const f=e.dataTransfer.files[0];
    if(f)parseFile(f);
  },[parseFile]);

  const uploadOrderCode=async()=>{
    if(!batchNum||!date){setStatus("error");setLog(["Укажите номер партии и дату"]);return;}
    if(!file){setStatus("error");setLog(["Загрузите файл"]);return;}
    setStatus("loading");setLog(["Читаем файл..."]);

    try{
      const XLSX=await import('https://esm.sh/xlsx@0.18.5');
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(new Uint8Array(buf),{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
      const headerIdx=rows.findIndex(r=>r.some&&r.some(c=>String(c).toLowerCase().includes('itemid')));
      if(headerIdx<0){setStatus("error");setLog(["Не найден заголовок"]);return;}
      const headers=rows[headerIdx].map(h=>String(h).trim().toLowerCase());
      const dataRows=rows.slice(headerIdx+1).filter(r=>r.some(c=>c!==""));
      const getCol=(row,name)=>{const idx=headers.indexOf(name);return idx>=0?row[idx]:"";}

      setLog(l=>[...l,`Всего строк в файле: ${dataRows.length}`]);
      setLog(l=>[...l,"Проверяем дубликаты в базе..."]);

      // Get existing shipments for this batch
      const existing=await sbFetch(`ordercode?select=shipment&batch=eq.${batchNum}&client_id=eq.${CLIENT_IDS[client]}&limit=100000`);
      const existingSet=new Set(existing.map(r=>r.shipment));
      setLog(l=>[...l,`Уже в базе: ${existingSet.size} записей`]);

      // Build insert rows
      const clientId=CLIENT_IDS[client];
      const batch=parseInt(batchNum);
      const records=[];
      const dupes=[];

      dataRows.forEach(row=>{
        const shipment=String(getCol(row,'itemid')||"").trim();
        if(!shipment)return;
        if(existingSet.has(shipment)){dupes.push(shipment);return;}
        const wg=parseFloat(getCol(row,'packageweight(g)'))||0;
        const country=String(getCol(row,'consigneecountry')||"").trim();
        const svc=String(getCol(row,'service')||"").trim();
        records.push({
          shipment,
          bigbags:String(getCol(row,'cartonid')||"").trim(),
          big_bag_id:String(getCol(row,'ordercode')||"").trim(),
          consigneecountry:country,
          service:svc,
          service_country:`${country} ${svc}`.trim(),
          weight_g:wg,
          weight_kg:parseFloat((wg/1000).toFixed(3)),
          danger_type:String(getCol(row,'danger_type')||"General").trim(),
          batch,
          date,
          client_id:clientId,
          batch_type:batchType||null,
        });
      });

      setLog(l=>[...l,`Дубликатов пропущено: ${dupes.length}`,`К загрузке: ${records.length} записей`]);

      if(!records.length){
        setStatus("done");
        setLog(l=>[...l,"✅ Нечего загружать — все записи уже в базе"]);
        return;
      }

      // Upload in chunks of 500
      const CHUNK=500;
      let uploaded=0;
      for(let i=0;i<records.length;i+=CHUNK){
        const chunk=records.slice(i,i+CHUNK);
        const r=await fetch(`${SB}/rest/v1/ordercode`,{
          method:'POST',
          headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,'Content-Type':'application/json','Prefer':'return=minimal'},
          body:JSON.stringify(chunk)
        });
        if(!r.ok){const t=await r.text();throw new Error(`Ошибка вставки: ${t}`);}
        uploaded+=chunk.length;
        setLog(l=>[...l,`Загружено ${uploaded} / ${records.length}...`]);
      }

      // Обновляем кеш volumes автоматически
      setLog(l=>[...l,"Обновляем кеш объёмов..."]);
      await fetch(`${SB}/rest/v1/rpc/refresh_volumes`,{
        method:'POST',
        headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,'Content-Type':'application/json'},
        body:'{}'
      });

      // Обновляем P&L кеши (выручка, расходы, партии)
      setLog(l=>[...l,"Обновляем P&L кеши..."]);
      await fetch(`${SB}/rest/v1/rpc/refresh_pl_caches`,{
        method:'POST',
        headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,'Content-Type':'application/json'},
        body:'{}'
      });

      setStatus("done");
      setLog(l=>[...l,`✅ Готово! Загружено ${records.length} записей, пропущено ${dupes.length} дубликатов. Все кеши обновлены.`]);
    }catch(err){
      setStatus("error");
      setLog(l=>[...l,`❌ Ошибка: ${err.message}`]);
    }
  };

  const uploadBatch=async()=>{
    if(!batchNum||!date||!bAwb||!bGross||!bCharge){
      setStatus("error");setLog(["Заполните все обязательные поля"]);return;
    }
    setStatus("loading");setLog(["Проверяем дубликат..."]);
    try{
      const existing=await sbFetch(`batches?select=party&party=eq.${batchNum}&client_id=eq.${CLIENT_IDS[client]}&limit=1`);
      if(existing.length){
        setStatus("error");setLog([`❌ Партия ${batchNum} для ${client} уже существует в базе`]);return;
      }
      const year=parseInt(date.split('.')[2])||parseInt(bYear);
      const record={
        year,date,
        from:bFrom,
        party:parseInt(batchNum),
        gross_weight:bGross,
        chargable_weight:bCharge,
        awb:parseInt(bAwb),
        agent:bAgent,
        p:`${bFrom}-${batchNum}`,
        client_id:CLIENT_IDS[client],
        batch_type:batchType||null,
      };
      const r=await fetch(`${SB}/rest/v1/batches`,{
        method:'POST',
        headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,'Content-Type':'application/json','Prefer':'return=minimal'},
        body:JSON.stringify(record)
      });
      if(!r.ok){const t=await r.text();throw new Error(t);}
      setLog(l=>[...l,"Обновляем P&L кеши..."]);
      await fetch(`${SB}/rest/v1/rpc/refresh_pl_caches`,{
        method:'POST',
        headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,'Content-Type':'application/json'},
        body:'{}'
      });
      setStatus("done");
      setLog([`✅ Партия ${batchNum} успешно добавлена. Кеши обновлены.`]);
    }catch(err){
      setStatus("error");setLog([`❌ Ошибка: ${err.message}`]);
    }
  };

  const selStyle=(active,color="var(--purple)")=>({
    padding:"7px 18px",borderRadius:20,fontSize:13,fontWeight:active?600:400,
    color:active?"#fff":"var(--muted)",background:active?color:"none",
    border:`1px solid ${active?color:"var(--border)"}`,cursor:"pointer",transition:"all 0.15s"
  });

  return h('div',{style:{background:"var(--bg)",minHeight:"100vh"}},
    h(Nav,{page:"upload",setPage}),
    h('div',{style:{maxWidth:860,margin:"0 auto",padding:"32px 24px"}},
      h('div',{style:{marginBottom:28}},
        h('div',{style:{fontSize:12,color:"var(--muted)",marginBottom:4}},"Загрузка данных в Supabase"),
        h('h1',{style:{fontSize:28,fontWeight:700,color:"var(--text)",letterSpacing:"-0.02em",display:"flex",alignItems:"center",gap:10}},
          h('span',null,"📤"),"Upload"
        )
      ),

      // Tab switcher
      h('div',{style:{display:"flex",gap:8,marginBottom:28,background:"var(--s2)",borderRadius:10,padding:4,width:"fit-content",border:"1px solid var(--border)"}},
        ...[["ordercode","Order Code"],["batches","Batches"]].map(([v,l])=>{
          const active=tab===v;
          return h('button',{key:v,onClick:()=>{setTab(v);reset();},style:{padding:"7px 20px",borderRadius:7,fontSize:13,fontWeight:active?600:400,color:active?"var(--text)":"var(--muted)",background:active?"var(--surface)":"none",boxShadow:active?"var(--shadow)":"none",transition:"all 0.15s",border:"none"}},l);
        })
      ),

      // ── ORDER CODE ──────────────────────────────────────────
      tab==="ordercode"&&h('div',null,
        // Client + batch type + batch num + date
        h('div',{style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:14,padding:24,marginBottom:20,boxShadow:"var(--shadow)"}},
          h('h2',{style:{fontSize:15,fontWeight:600,marginBottom:16}},"1. Параметры партии"),
          h('div',{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:14}},
            h('div',null,
              h('div',{style:{fontSize:12,color:"var(--muted)",marginBottom:6,fontWeight:500}},"Клиент"),
              h('div',{style:{display:"flex",gap:6}},
                ...Object.keys(CLIENT_IDS).map(c=>h('button',{key:c,onClick:()=>setClient(c),style:selStyle(client===c)},c))
              )
            ),
            h('div',null,
              h('div',{style:{fontSize:12,color:"var(--muted)",marginBottom:6,fontWeight:500}},"Тип партии"),
              h('div',{style:{display:"flex",gap:6}},
                ...[["","—"],["MKO","MKO"],["MPO","MPO"]].map(([v,l])=>h('button',{key:v,onClick:()=>setBatchType(v),style:selStyle(batchType===v,"var(--accent)")},l))
              )
            ),
            h('div',null,h(Inp,{label:"Номер партии *",value:batchNum,onChange:setBatchNum,placeholder:"784",type:"number"})),
            h('div',null,h(Inp,{label:"Дата партии * (ДД.ММ.ГГГГ)",value:date,onChange:setDate,placeholder:"14.05.2026",type:"text"}))
          )
        ),

        // File upload
        h('div',{style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:14,padding:24,marginBottom:20,boxShadow:"var(--shadow)"}},
          h('h2',{style:{fontSize:15,fontWeight:600,marginBottom:16}},"2. Файл манифеста (.xlsx или .csv)"),
          h('div',{
            onDrop:handleDrop,
            onDragOver:e=>{e.preventDefault();setDragOver(true);},
            onDragLeave:()=>setDragOver(false),
            style:{border:`2px dashed ${dragOver?"var(--purple)":"var(--border)"}`,borderRadius:12,padding:"40px 24px",textAlign:"center",background:dragOver?"var(--purple-dim)":"var(--s2)",transition:"all 0.15s",cursor:"pointer"},
            onClick:()=>document.getElementById('fileInput').click()
          },
            h('input',{id:"fileInput",type:"file",accept:".xlsx,.csv",style:{display:"none"},onChange:e=>{if(e.target.files[0])parseFile(e.target.files[0]);}}),
            file
              ?h('div',null,
                  h('div',{style:{fontSize:24,marginBottom:8}},"📄"),
                  h('div',{style:{fontWeight:600,color:"var(--text)",marginBottom:4}},file.name),
                  h('div',{style:{fontSize:12,color:"var(--muted)"}},"Нажми чтобы заменить")
                )
              :h('div',null,
                  h('div',{style:{fontSize:32,marginBottom:8}},"📂"),
                  h('div',{style:{fontWeight:500,color:"var(--text)",marginBottom:4}},"Перетащи файл или нажми"),
                  h('div',{style:{fontSize:12,color:"var(--muted)"}},"Поддерживается .xlsx и .csv")
                )
          ),

          // Preview
          preview.length>0&&h('div',{style:{marginTop:20,overflowX:"auto"}},
            h('div',{style:{fontSize:12,color:"var(--muted)",marginBottom:8,fontWeight:500}},"Предпросмотр первых 5 строк:"),
            h('table',null,
              h('thead',null,h('tr',null,...["shipment","bigbags","big_bag_id","country","service","вес(г)","danger"].map(hh=>h('th',{key:hh,style:{padding:"8px 12px",textAlign:"left",color:"var(--muted)",fontSize:11,fontWeight:500,borderBottom:"1px solid var(--border)",background:"var(--s2)"}},hh)))),
              h('tbody',null,...preview.map((r,i)=>h('tr',{key:i},
                ...[r.shipment,r.bigbags,r.big_bag_id,r.consigneecountry,r.service,r.weight_g,r.danger_type].map((v,j)=>
                  h('td',{key:j,style:{padding:"8px 12px",fontSize:12,fontFamily:"monospace",borderBottom:"1px solid var(--border)"}},String(v||"—").slice(0,30))
                )
              )))
            )
          )
        ),

        // Upload button + log
        h('div',{style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:14,padding:24,boxShadow:"var(--shadow)"}},
          h('div',{style:{display:"flex",gap:12,alignItems:"center",marginBottom:log.length?16:0}},
            h('button',{
              onClick:uploadOrderCode,
              disabled:status==="loading",
              style:{background:status==="loading"?"var(--s3)":"var(--purple)",color:status==="loading"?"var(--muted)":"#fff",border:"none",padding:"10px 28px",borderRadius:8,fontWeight:600,fontSize:14,cursor:status==="loading"?"not-allowed":"pointer",transition:"all 0.15s"}
            },status==="loading"?"Загружаем...":"🚀 Загрузить в Supabase"),
            status==="done"&&h('span',{style:{color:"var(--success)",fontWeight:600,fontSize:13}},"✅ Успешно!"),
            status==="error"&&h('span',{style:{color:"var(--danger)",fontWeight:600,fontSize:13}},"❌ Ошибка")
          ),
          log.length>0&&h('div',{style:{background:"var(--s2)",borderRadius:8,padding:"12px 16px",fontFamily:"monospace",fontSize:12,lineHeight:1.8}},
            ...log.map((l,i)=>h('div',{key:i,style:{color:l.startsWith("✅")?"var(--success)":l.startsWith("❌")?"var(--danger)":"var(--text)"}},l))
          )
        )
      ),

      // ── BATCHES ─────────────────────────────────────────────
      tab==="batches"&&h('div',null,
        h('div',{style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:14,padding:24,marginBottom:20,boxShadow:"var(--shadow)"}},
          h('h2',{style:{fontSize:15,fontWeight:600,marginBottom:20}},"Новая партия"),
          h('div',{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:16}},
            h('div',null,
              h('div',{style:{fontSize:12,color:"var(--muted)",marginBottom:6,fontWeight:500}},"Клиент *"),
              h('div',{style:{display:"flex",gap:6,flexWrap:"wrap"}},
                ...Object.keys(CLIENT_IDS).map(c=>h('button',{key:c,onClick:()=>setClient(c),style:selStyle(client===c)},c))
              )
            ),
            h('div',null,
              h('div',{style:{fontSize:12,color:"var(--muted)",marginBottom:6,fontWeight:500}},"Тип партии"),
              h('div',{style:{display:"flex",gap:6}},
                ...[["","—"],["MKO","MKO"],["MPO","MPO"]].map(([v,l])=>h('button',{key:v,onClick:()=>setBatchType(v),style:selStyle(batchType===v,"var(--accent)")},l))
              )
            ),
            h('div',null,h(Inp,{label:"Номер партии *",value:batchNum,onChange:setBatchNum,placeholder:"784",type:"number"})),
            h('div',null,h(Inp,{label:"Дата * (ДД.ММ.ГГГГ)",value:date,onChange:setDate,placeholder:"14.05.2026",type:"text"})),
            h('div',null,
              h('div',{style:{fontSize:12,color:"var(--muted)",marginBottom:6,fontWeight:500}},"From"),
              h('div',{style:{display:"flex",gap:6,flexWrap:"wrap"}},
                ...["CAINIAO","UZUM"].map(c=>h('button',{key:c,onClick:()=>setBFrom(c),style:selStyle(bFrom===c,"var(--blue)")},c))
              )
            ),
            h('div',null,h(Inp,{label:"AWB *",value:bAwb,onChange:setBAwb,placeholder:"78483953343",type:"text"})),
            h('div',null,h(Inp,{label:"Gross weight (кг) *",value:bGross,onChange:setBGross,placeholder:"537",type:"text"})),
            h('div',null,h(Inp,{label:"Chargable weight (кг) *",value:bCharge,onChange:setBCharge,placeholder:"770",type:"text"})),
            h('div',null,h(Inp,{label:"Агент",value:bAgent,onChange:setBAgent,placeholder:"SILKWAY",type:"text"}))
          )
        ),

        h('div',{style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:14,padding:24,boxShadow:"var(--shadow)"}},
          h('div',{style:{display:"flex",gap:12,alignItems:"center",marginBottom:log.length?16:0}},
            h('button',{
              onClick:uploadBatch,
              disabled:status==="loading",
              style:{background:status==="loading"?"var(--s3)":"var(--purple)",color:status==="loading"?"var(--muted)":"#fff",border:"none",padding:"10px 28px",borderRadius:8,fontWeight:600,fontSize:14,cursor:status==="loading"?"not-allowed":"pointer"}
            },status==="loading"?"Сохраняем...":"💾 Сохранить партию"),
            status==="done"&&h('span',{style:{color:"var(--success)",fontWeight:600,fontSize:13}},"✅ Партия добавлена!"),
            status==="error"&&h('span',{style:{color:"var(--danger)",fontWeight:600,fontSize:13}},"❌ Ошибка")
          ),
          log.length>0&&h('div',{style:{background:"var(--s2)",borderRadius:8,padding:"12px 16px",fontFamily:"monospace",fontSize:12,lineHeight:1.8}},
            ...log.map((l,i)=>h('div',{key:i,style:{color:l.startsWith("✅")?"var(--success)":l.startsWith("❌")?"var(--danger)":"var(--text)"}},l))
          )
        )
      )
    ),
    h('footer',{style:{borderTop:"1px solid var(--border)",padding:"16px 24px",textAlign:"center",fontSize:12,color:"var(--muted)"}},"© 2026 Antria Group")
  );
};

// ── 3PL P&L ────────────────────────────────────────────────────
const PLPage=({setPage})=>{
  const[data,setData]=useState(null);
  const[loading,setLoading]=useState(true);
  const[err,setErr]=useState(null);
  const[year,setYear]=useState(2026);
  const[filter,setFilter]=useState("all");
  const[expanded,setExpanded]=useState({});
  const[viewMode,setViewMode]=useState("weeks"); // "weeks" | "months"
  const[drillDown,setDrillDown]=useState(null); // "rev"|"exp"|"profit"|null
  const[topBatches,setTopBatches]=useState(null);
  const[checks,setChecks]=useState(null);
  const[checksLoading,setChecksLoading]=useState(false);
  const[showChecks,setShowChecks]=useState(false);

  useEffect(()=>{
    setLoading(true);setErr(null);
    const fn=viewMode==="months"?'get_pl_monthly':'get_pl_weekly';
    sbRpc(fn,{p_year:year})
      .then(d=>{
        const filtered=(d||[]).filter(w=>Number(w.total_revenue||0)>0||Number(w.total_expenses||0)>0);
        setData(filtered);setLoading(false);
      })
      .catch(e=>{setErr(e.message);setLoading(false)});
    // Fetch top batches for drill-down
    sbFetch(`pl_batch_cache?year=eq.${year}&select=batch,client_code,batch_type,week_num,revenue,expenses&order=revenue.desc&limit=200`)
      .then(d=>setTopBatches(d||[]))
      .catch(()=>{});
  },[year,viewMode]);

  // Monthly labels
  const MONTH_NAMES=["","Янв","Фев","Мар","Апр","Май","Июн","Июл","Авг","Сен","Окт","Ноя","Дек"];
  // Normalize: monthly data has month_num, weekly has week_num
  const displayData=useMemo(()=>{
    if(!data||!data.length)return null;
    if(viewMode==="months"){
      return data.map(m=>({...m,week_num:"M"+m.month_num,label:MONTH_NAMES[m.month_num]||"M"+m.month_num}));
    }
    return data;
  },[data,viewMode]);

  const tog=(k)=>setExpanded(p=>({...p,[k]:!p[k]}));
  const fmtV=(n)=>{if(n==null||isNaN(n))return"—";return Number(n).toLocaleString('en-US',{maximumFractionDigits:0})};
  const fmtPct=(n)=>{if(n==null||isNaN(n))return"—";return(Number(n)*100).toFixed(1)+"%"};
  const pColor=(v)=>Number(v)>=0?"var(--success)":"var(--danger)";

  // Compute totals across all weeks, including detail sums
  const totals=useMemo(()=>{
    if(!data||!data.length)return null;
    const t={cn_revenue:0,cn_expenses:0,cn_profit:0,ucb_revenue:0,ucb_expenses:0,ucb_profit:0,total_revenue:0,total_expenses:0,total_profit:0,cn_batches:0,ucb_batches:0};
    const cnDetail={};
    const ucbDetail={};
    const cnCountries={};
    data.forEach(w=>{
      t.cn_revenue+=Number(w.cn_revenue||0);
      t.cn_expenses+=Number(w.cn_expenses||0);
      t.cn_profit+=Number(w.cn_profit||0);
      t.ucb_revenue+=Number(w.ucb_revenue||0);
      t.ucb_expenses+=Number(w.ucb_expenses||0);
      t.ucb_profit+=Number(w.ucb_profit||0);
      t.total_revenue+=Number(w.total_revenue||0);
      t.total_expenses+=Number(w.total_expenses||0);
      t.total_profit+=Number(w.total_profit||0);
      t.cn_batches+=Number(w.cn_batches||0);
      t.ucb_batches+=Number(w.ucb_batches||0);
      t.ucb_mko_revenue=(t.ucb_mko_revenue||0)+Number(w.ucb_mko_revenue||0);
      t.ucb_mpo_revenue=(t.ucb_mpo_revenue||0)+Number(w.ucb_mpo_revenue||0);
      // Sum CN expense details
      if(w.cn_exp_details){
        Object.entries(w.cn_exp_details).forEach(([k,v])=>{cnDetail[k]=(cnDetail[k]||0)+Number(v||0)});
      }
      // Sum UCB expense details
      (w.ucb_exp_details||[]).forEach(d=>{ucbDetail[d.name]=(ucbDetail[d.name]||0)+Number(d.amount||0)});
      // Sum CN country details
      (w.cn_countries||[]).forEach(c=>{
        if(!cnCountries[c.country])cnCountries[c.country]={revenue:0,linehaul:0,lastmile:0};
        cnCountries[c.country].revenue+=Number(c.revenue||0);
        cnCountries[c.country].linehaul+=Number(c.linehaul||0);
        cnCountries[c.country].lastmile+=Number(c.lastmile||0);
      });
    });
    t.cnDetail=cnDetail;
    t.ucbDetail=ucbDetail;
    t.cnCountries=cnCountries;
    return t;
  },[data]);

  const CN_EXP={
    exp_311:"3.1.1 Обработка груза в Китае",exp_312:"3.1.2 Первая миля Китай-Ташкент",
    exp_313:"3.1.3 Аэропортовые сборы",exp_local:"Местные сборы Китай",
    exp_314_1:"3.1.4 Последняя миля UZ (1)",exp_314_2:"3.1.4 Последняя миля UZ (2)",
    exp_315:"3.1.5 Вторая миля авиа",exp_316:"3.1.6 Вторая миля авто BY",
    exp_317:"3.1.7 Комиссия почты кг",exp_318_kg:"3.1.8 Комиссия почты кг SW",
    exp_318_pcs:"3.1.8 Комиссия почты шт SW",exp_319:"3.1.9 Лейблинг",
    exp_fat:"ФОТ",exp_e_transit:"E-Transit",exp_airport:"Ускорение аэропорт"
  };

  // ── Export to Excel ──
  const r2=(v)=>v!=null&&!isNaN(v)?Math.round(Number(v)*100)/100:0;
  useEffect(()=>{
    window.__exportXlsx=()=>{
      if(!data||!data.length)return alert("Нет данных для экспорта");
      try{
        const wb=XLSX.utils.book_new();
        // Sheet 1: P&L Weekly Summary
        const hdr=["Показатель",...data.map(w=>"W"+w.week_num),"ИТОГО"];
        const rows=[
          ["Выручка 3PL",...data.map(w=>r2(w.total_revenue)),r2(totals.total_revenue)],
          ["  Cainiao",...data.map(w=>r2(w.cn_revenue)),r2(totals.cn_revenue)],
          ["  UZUM CB",...data.map(w=>r2(w.ucb_revenue)),r2(totals.ucb_revenue)],
          ["    MKO",...data.map(w=>r2(w.ucb_mko_revenue)),r2(totals.ucb_mko_revenue)],
          ["    MPO",...data.map(w=>r2(w.ucb_mpo_revenue)),r2(totals.ucb_mpo_revenue)],
          [],
          ["Расходы 3PL",...data.map(w=>r2(w.total_expenses)),r2(totals.total_expenses)],
          ["  Cainiao",...data.map(w=>r2(w.cn_expenses)),r2(totals.cn_expenses)],
          ["  UZUM CB",...data.map(w=>r2(w.ucb_expenses)),r2(totals.ucb_expenses)],
          [],
          ["Прибыль",...data.map(w=>r2(w.total_profit)),r2(totals.total_profit)],
          ["  Cainiao",...data.map(w=>r2(w.cn_profit)),r2(totals.cn_profit)],
          ["  UZUM CB",...data.map(w=>r2(w.ucb_profit)),r2(totals.ucb_profit)],
          [],
          ["Маржа %",...data.map(w=>{const r=Number(w.total_revenue||0);return r>0?Math.round(Number(w.total_profit||0)/r*1000)/10:0}),totals.total_revenue>0?Math.round(totals.total_profit/totals.total_revenue*1000)/10:0],
          [],
          ["Батчей Cainiao",...data.map(w=>Number(w.cn_batches||0)),totals.cn_batches],
          ["Батчей UZUM CB",...data.map(w=>Number(w.ucb_batches||0)),totals.ucb_batches],
        ];
        // CN expense details
        rows.push([],["--- Cainiao расходы ---"]);
        Object.entries(CN_EXP).forEach(([k,label])=>{
          rows.push(["  "+label,...data.map(w=>r2((w.cn_exp_details||{})[k])),r2(totals.cnDetail[k])]);
        });
        // UCB expense details
        rows.push([],["--- UZUM CB расходы ---"]);
        const ucbNames=[...new Set(data.flatMap(w=>(w.ucb_exp_details||[]).map(d=>d.name)))].sort();
        ucbNames.forEach(name=>{
          rows.push(["  "+name,...data.map(w=>{const d=(w.ucb_exp_details||[]).find(e=>e.name===name);return r2(d?.amount)}),r2(totals.ucbDetail[name])]);
        });
        // CN country revenue
        rows.push([],["--- Cainiao выручка по странам ---"]);
        ["UZ","BY","AZ","KG"].forEach(cc=>{
          rows.push(["  "+cc,...data.map(w=>{const c=(w.cn_countries||[]).find(x=>x.country===cc);return r2(c?.revenue)}),r2(totals.cnCountries[cc]?.revenue)]);
        });
        const ws=XLSX.utils.aoa_to_sheet([hdr,...rows]);
        ws['!cols']=[{wch:35},...data.map(()=>({wch:12})),{wch:14}];
        XLSX.utils.book_append_sheet(wb,ws,"P&L Weekly");
        XLSX.writeFile(wb,`3PL_PL_${year}_export.xlsx`);
      }catch(e){alert("Ошибка экспорта: "+e.message)}
    };
    return()=>{window.__exportXlsx=null};
  },[data,totals,year]);

  const cs=(isH)=>({padding:isH?"10px 12px":"8px 12px",fontSize:isH?11:12,fontWeight:isH?600:400,
    color:isH?"var(--text)":"var(--text2)",background:isH?"var(--s2)":"none",
    borderBottom:"1px solid var(--border)",whiteSpace:"nowrap",
    fontFamily:"'JetBrains Mono',monospace",textAlign:"right",minWidth:85});
  const ls=(lv=0,b=false,ac=false)=>({padding:"8px 12px",paddingLeft:12+lv*16,fontSize:13,
    fontWeight:b?600:400,color:ac?"var(--accent)":"var(--text)",
    borderBottom:"1px solid var(--border)",whiteSpace:"nowrap",
    position:"sticky",left:0,background:"var(--surface)",zIndex:2,minWidth:260,
    cursor:b?"pointer":"default"});

  // Generic row renderer
  // getValue(weekData) → number for each week cell
  // totalVal → explicit total (sum across weeks), avoids broken proxy
  // format: "$" | "#" | "%" 
  const mkRow=(key,label,getValue,totalVal,opts={})=>{
    const{lv=0,bold=false,accent=false,profit=false,expKey=null,fmt="$"}=opts;
    const isOpen=expanded[expKey];
    return h('tr',{key},
      h('td',{style:ls(lv,bold,accent),onClick:expKey?()=>tog(expKey):undefined},
        expKey?h('span',{style:{marginRight:6,display:"inline-block",transform:isOpen?"rotate(90deg)":"none",transition:"transform 0.15s",fontSize:10}},"▶"):null,
        label
      ),
      ...(displayData||[]).map((w,i)=>{
        const v=getValue(w);
        const st={...cs(false)};
        if(profit)st.color=pColor(v);
        if(bold)st.fontWeight=600;
        if(fmt==="%")st.fontSize=11;
        return h('td',{key:i,style:st},
          fmt==="%"?fmtPct(v):fmt==="#"?fmtV(v):('$'+fmtV(v))
        );
      }),
      h('td',{key:"t",style:{...cs(false),fontWeight:600,background:"var(--s2)",
        ...(profit?{color:pColor(totalVal)}:{})}},
        fmt==="%"?fmtPct(totalVal):fmt==="#"?fmtV(totalVal):('$'+fmtV(totalVal))
      )
    );
  };

  const rows=[];
  if(!data||!totals){/* empty */}else{
    const t=totals;
    const showCn=filter!=="uzum", showUcb=filter!=="cainiao";

    // ── REVENUE ──
    const COUNTRY_LABELS={UZ:"Узбекистан",BY:"Беларусь",AZ:"Азербайджан",KG:"Киргизия"};
    rows.push(mkRow("rev","ВЫРУЧКА 3PL",w=>w.total_revenue,t.total_revenue,{bold:true,accent:true,expKey:"rev"}));
    if(expanded["rev"]){
      if(showCn){
        rows.push(mkRow("rev_cn","Cainiao",w=>w.cn_revenue,t.cn_revenue,{lv:1,bold:true,expKey:"rev_cn"}));
        if(expanded["rev_cn"]){
          rows.push(mkRow("rev_cn_b","Батчей (Cn)",w=>w.cn_batches,t.cn_batches,{lv:2,fmt:"#"}));
          ["UZ","BY","AZ","KG"].forEach(cc=>{
            const getC=(w)=>(w.cn_countries||[]).find(c=>c.country===cc);
            const tC=t.cnCountries[cc]||{revenue:0,linehaul:0,lastmile:0};
            rows.push(mkRow("rev_cn_"+cc,COUNTRY_LABELS[cc],w=>{const c=getC(w);return c?c.revenue:0},tC.revenue,{lv:2,bold:true,expKey:"rev_cn_"+cc}));
            if(expanded["rev_cn_"+cc]){
              rows.push(mkRow("rev_cn_"+cc+"_lh","Лайнхолл (кг)",w=>{const c=getC(w);return c?c.linehaul:0},tC.linehaul,{lv:3}));
              rows.push(mkRow("rev_cn_"+cc+"_lm","Последняя миля (шт)",w=>{const c=getC(w);return c?c.lastmile:0},tC.lastmile,{lv:3}));
            }
          });
        }
      }
      if(showUcb){
        rows.push(mkRow("rev_ucb","UZUM CB",w=>w.ucb_revenue,t.ucb_revenue,{lv:1,bold:true,expKey:"rev_ucb"}));
        if(expanded["rev_ucb"]){
          rows.push(mkRow("rev_ucb_b","Батчей (UCB)",w=>w.ucb_batches,t.ucb_batches,{lv:2,fmt:"#"}));
          rows.push(mkRow("rev_ucb_mko","MKO",w=>w.ucb_mko_revenue,t.ucb_mko_revenue,{lv:2,bold:true}));
          rows.push(mkRow("rev_ucb_mpo","MPO",w=>w.ucb_mpo_revenue,t.ucb_mpo_revenue,{lv:2,bold:true}));
        }
      }
    }

    // ── EXPENSES ──
    rows.push(mkRow("exp","РАСХОДЫ",w=>Number(w.cn_expenses||0)+Number(w.ucb_expenses||0),t.cn_expenses+t.ucb_expenses,{bold:true,accent:true,expKey:"exp"}));
    if(expanded["exp"]){
      if(showCn){
        rows.push(mkRow("exp_cn","Cainiao расходы",w=>w.cn_expenses,t.cn_expenses,{lv:1,bold:true,expKey:"exp_cn"}));
        if(expanded["exp_cn"]){
          Object.entries(CN_EXP).forEach(([k,lbl])=>{
            rows.push(mkRow("cn_"+k,lbl,w=>(w.cn_exp_details||{})[k]||0,t.cnDetail[k]||0,{lv:2}));
          });
        }
      }
      if(showUcb){
        rows.push(mkRow("exp_ucb","UZUM CB расходы",w=>w.ucb_expenses,t.ucb_expenses,{lv:1,bold:true,expKey:"exp_ucb"}));
        if(expanded["exp_ucb"]){
          const names=new Set();
          data.forEach(w=>(w.ucb_exp_details||[]).forEach(d=>names.add(d.name)));
          [...names].sort().forEach(name=>{
            rows.push(mkRow("ucb_"+name,name,w=>{
              const f=(w.ucb_exp_details||[]).find(d=>d.name===name);
              return f?f.amount:0;
            },t.ucbDetail[name]||0,{lv:2}));
          });
        }
      }
    }

    // ── PROFIT ──
    rows.push(mkRow("profit","ВАЛОВАЯ ПРИБЫЛЬ",w=>w.total_profit,t.total_profit,{bold:true,accent:true,profit:true}));
    if(showCn)rows.push(mkRow("profit_cn","Cainiao прибыль",w=>w.cn_profit,t.cn_profit,{lv:1,profit:true}));
    if(showUcb)rows.push(mkRow("profit_ucb","UZUM CB прибыль",w=>w.ucb_profit,t.ucb_profit,{lv:1,profit:true}));
    const totalMargin=t.total_revenue>0?t.total_profit/t.total_revenue:0;
    rows.push(mkRow("margin","Маржа %",w=>{const r=Number(w.total_revenue||0);return r>0?Number(w.total_profit||0)/r:0},totalMargin,{bold:true,fmt:"%"}));
  }

  return h('div',{style:{minHeight:"100vh",display:"flex",flexDirection:"column"}},
    h(Nav,{page:"pl",setPage}),
    h('div',{style:{maxWidth:1400,margin:"0 auto",padding:"24px",width:"100%",flex:1}},

      h('div',{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:24,flexWrap:"wrap",gap:12}},
        h('div',null,
          h('h1',{style:{fontSize:20,fontWeight:700,color:"var(--text)",marginBottom:4}},"3PL P&L"),
          h('div',{style:{fontSize:13,color:"var(--muted)"}},"Еженедельный отчёт о прибылях и убытках")
        ),
        h('div',{style:{display:"flex",gap:8,alignItems:"center"}},
          h(Sel,{value:String(year),onChange:v=>setYear(Number(v)),options:[{value:"2026",label:"2026"},{value:"2025",label:"2025"}]}),
          h('div',{style:{display:"flex",gap:4,background:"var(--s2)",borderRadius:10,padding:4,border:"1px solid var(--border)"}},
            ...["weeks","months"].map(m=>{
              const active=viewMode===m;
              return h('button',{key:m,onClick:()=>setViewMode(m),style:{padding:"6px 14px",borderRadius:7,fontSize:12,fontWeight:active?600:400,color:active?"var(--text)":"var(--muted)",background:active?"var(--surface)":"none",boxShadow:active?"var(--shadow)":"none",transition:"all 0.15s",border:"none"}},{weeks:"Недели",months:"Месяцы"}[m]);
            })
          ),
          h('div',{style:{display:"flex",gap:4,background:"var(--s2)",borderRadius:10,padding:4,border:"1px solid var(--border)"}},
            ...["all","cainiao","uzum"].map(f=>{
              const active=filter===f;
              return h('button',{key:f,onClick:()=>setFilter(f),style:{padding:"6px 14px",borderRadius:7,fontSize:12,fontWeight:active?600:400,color:active?"var(--text)":"var(--muted)",background:active?"var(--surface)":"none",boxShadow:active?"var(--shadow)":"none",transition:"all 0.15s",border:"none"}},{all:"Все",cainiao:"Cainiao",uzum:"UZUM CB"}[f]);
            })
          ),
          h('button',{onClick:()=>{
            if(showChecks){setShowChecks(false);return;}
            setChecksLoading(true);setShowChecks(true);
            sbRpc('run_pl_checks',{p_year:year}).then(d=>{setChecks(d);setChecksLoading(false)}).catch(e=>{setChecks({error:e.message});setChecksLoading(false)});
          },style:{padding:"6px 14px",borderRadius:8,fontSize:12,fontWeight:600,color:checks?.summary?.all_pass?"var(--success)":"var(--muted)",background:checks?.summary?.all_pass?"rgba(5,150,105,0.1)":"var(--s2)",border:"1px solid "+(checks?.summary?.all_pass?"rgba(5,150,105,0.3)":"var(--border)"),transition:"all 0.15s",display:"flex",alignItems:"center",gap:5}},
            checks?.summary?.all_pass?"✅":"🔍"," Чеки")
        )
      ),

      // ── Checks Panel ──
      showChecks&&h('div',{style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:14,padding:"20px 24px",marginBottom:16,boxShadow:"var(--shadow)"}},
        checksLoading?h('div',{style:{textAlign:"center",padding:20}},h(Spinner)):
        checks?.error?h('div',{style:{color:"var(--danger)",fontSize:13}},"Ошибка: "+checks.error):
        checks?.summary?h('div',null,
          // Summary bar
          h('div',{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}},
            h('div',{style:{display:"flex",alignItems:"center",gap:10}},
              h('span',{style:{fontSize:24}},checks.summary.all_pass?"✅":"⚠️"),
              h('div',null,
                h('div',{style:{fontSize:15,fontWeight:700,color:checks.summary.all_pass?"var(--success)":"var(--danger)"}},
                  checks.summary.all_pass?"Все проверки пройдены":"Есть проблемы"),
                h('div',{style:{fontSize:12,color:"var(--muted)"}},
                  checks.summary.checks_passed+"/"+checks.summary.checks_run+" чеков · "+new Date(checks.summary.run_at).toLocaleString('ru-RU'))
              )
            ),
            h('button',{onClick:()=>setShowChecks(false),style:{background:"none",border:"none",fontSize:18,color:"var(--muted)",cursor:"pointer"}},"✕")
          ),
          // All checks - generic render
          ...(checks.checks||[]).map((ck,i)=>{
            const pass=(ck.pass===true||ck.pass==='true');
            const bc=pass?"rgba(5,150,105,":"rgba(220,38,38,";
            // Collect stats to display
            const stats=Object.entries(ck).filter(([k])=>!['name','description','pass','mismatches','issues','sources','split'].includes(k)&&typeof ck[k]!=='object');
            const issues=ck.mismatches||ck.issues||[];
            return h('div',{key:i,style:{borderRadius:10,border:"1px solid "+bc+"0.3)",background:bc+"0.04)",padding:"14px 18px",marginBottom:10}},
              h('div',{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}},
                h('div',{style:{fontSize:13,fontWeight:700,color:"var(--text)"}},pass?"✅":"❌"," Чек "+(i+1)+": "+ck.name),
                h('span',{style:{fontSize:11,fontWeight:600,color:pass?"var(--success)":"var(--danger)",padding:"2px 8px",borderRadius:6,background:bc+"0.1)"}},pass?"PASS":"FAIL")
              ),
              ck.description&&h('div',{style:{fontSize:12,color:"var(--muted)",marginBottom:8}},ck.description),
              // Sources (for pipeline check)
              ck.sources&&h('div',{style:{marginBottom:8}},

          const margin=ft.rev>0?((ft.profit/ft.rev)*100).toFixed(1):"0";
          return[ 
          {key:"rev",label:"ВЫРУЧКА",value:'$'+fmtV(ft.rev),sub:ft.sub1?ft.sub1:`Cn: $${fmtV(totals.cn_revenue)} | UCB: $${fmtV(totals.ucb_revenue)}`,icon:"💰",color:"var(--purple)"},

            name:viewMode==="months"?(w.label||"M"+w.month_num):"W"+w.week_num,

            h(XAxis,{dataKey:"name",tick:{fontSize:11,fill:"var(--muted)"},tickLine:false,axisLine:false}),
            h(YAxis,{yAxisId:"left",tick:{fontSize:10,fill:"var(--muted)"},tickLine:false,axisLine:false,tickFormatter:v=>"$"+Math.round(v/1000)+"k"}),
            h(YAxis,{yAxisId:"right",orientation:"right",tick:{fontSize:10,fill:"var(--muted)"},tickLine:false,axisLine:false,tickFormatter:v=>v+"%",domain:[0,'auto']}),
            h(Tooltip,{contentStyle:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:10,fontSize:12},formatter:(v,n)=>[n==="margin"?v+"%":"$"+Number(v).toLocaleString(),{revenue:"Выручка",expense:"Расходы",profit:"Прибыль",margin:"Маржа"}[n]||n]}),
            h(Bar,{yAxisId:"left",dataKey:"revenue",fill:"var(--purple)",radius:[4,4,0,0],opacity:0.85,name:"revenue"}),

      // ── Auto-insights ──

        }));
        const first4=weeks.slice(0,4), last4=weeks.slice(-4);
        const avgR=a=>a.reduce((s,x)=>s+x.rev,0)/a.length;
        const avgM=a=>a.reduce((s,x)=>s+x.margin,0)/a.length;
        const revTrend=((avgR(last4)-avgR(first4))/avgR(first4)*100);
        const marginTrend=avgM(last4)-avgM(first4);
        const best=weeks.reduce((b,w)=>w.margin>b.margin?w:b,weeks[0]);
        const worst=weeks.reduce((b,w)=>w.margin<b.margin?w:b,weeks[0]);
        const insights=[];
        if(revTrend>5)insights.push({tone:"good",text:`📈 Выручка растёт: последние 4 недели выше первых на ${revTrend.toFixed(1)}%`});
        else if(revTrend<-5)insights.push({tone:"bad",text:`📉 Выручка падает: последние 4 недели ниже первых на ${Math.abs(revTrend).toFixed(1)}%`});
        else insights.push({tone:"info",text:`📊 Выручка стабильна (тренд ${revTrend>0?"+":""}${revTrend.toFixed(1)}%)`});
        if(marginTrend>3)insights.push({tone:"good",text:`✅ Маржа улучшается: +${marginTrend.toFixed(1)} п.п. за период`});
        else if(marginTrend<-3)insights.push({tone:"bad",text:`⚠️ Маржа падает: ${marginTrend.toFixed(1)} п.п. за период`});
        insights.push({tone:"info",text:`🏆 Лучшая неделя W${best.w} (маржа ${best.margin.toFixed(1)}%, прибыль $${Math.round(best.profit).toLocaleString()})`});
        insights.push({tone:"info",text:`📋 Худшая неделя W${worst.w} (маржа ${worst.margin.toFixed(1)}%, прибыль $${Math.round(worst.profit).toLocaleString()})`});
        const toneColors={good:"var(--success)",bad:"var(--danger)",info:"var(--muted)"};
        return h('div',{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))",gap:8,marginBottom:20}},
          ...insights.map((ins,i)=>h('div',{key:i,style:{padding:"10px 14px",borderRadius:10,border:"1px solid var(--border)",background:"var(--surface)",fontSize:12,color:toneColors[ins.tone]||"var(--text)",fontWeight:500}},ins.text))
        );
      })(),

      loading&&h(Spinner),
      err&&h(ErrBox,{msg:err}),

      !loading&&!err&&displayData&&displayData.length>0&&h('div',{style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:14,boxShadow:"var(--shadow)",overflow:"hidden"}},
        h('div',{style:{overflowX:"auto"}},
          h('table',{style:{borderCollapse:"collapse",minWidth:"100%"}},
            h('thead',null,
              h('tr',null,
                h('th',{style:{...cs(true),position:"sticky",left:0,zIndex:3,background:"var(--s2)",textAlign:"left",minWidth:260}},"Показатель"),
                ...((displayData||[]).map((w,i)=>h('th',{key:i,style:cs(true)},viewMode==="months"?(w.label||"M"+w.month_num):"W"+w.week_num))),
                h('th',{style:{...cs(true),background:"var(--accent-dim)",color:"var(--accent)",fontWeight:700}},"Total")
              )
            ),
            h('tbody',null,...rows)
          )
        )
      ),

      totals&&h('div',{style:{marginTop:20,background:"var(--s2)",borderRadius:10,padding:"14px 18px",fontSize:12,color:"var(--muted)"}},
        h('div',{style:{fontWeight:600,marginBottom:8,color:"var(--text)"}},"Верификация"),
        h('div',null,"✅ Revenue = Cn + UCB: $",fmtV(totals.cn_revenue+totals.ucb_revenue)," = $",fmtV(totals.cn_revenue)," + $",fmtV(totals.ucb_revenue)),
        h('div',null,"✅ Profit = Rev − Exp: $",fmtV(totals.total_profit)," = $",fmtV(totals.total_revenue)," − $",fmtV(totals.total_expenses)),
        h('div',null,"✅ Маржа: ",(totals.total_revenue>0?((totals.total_profit/totals.total_revenue)*100).toFixed(1):"0"),"%"),
        h('div',null,"✅ Батчей: ",totals.cn_batches+totals.ucb_batches," (Cn: ",totals.cn_batches,", UCB: ",totals.ucb_batches,")")
      )
    ),
    h('footer',{style:{borderTop:"1px solid var(--border)",padding:"16px 24px",textAlign:"center",fontSize:12,color:"var(--muted)"}},"© 2026 Antria Group")
  );
};

// ── MARKERS ────────────────────────────────────────────────────
const TYPE_COLORS={"CAINIAO":"#7c3aed","UZUM MPO":"#059669","UZUM MKO":"#ea580c"};
const TYPE_BG={"CAINIAO":"rgba(124,58,237,0.08)","UZUM MPO":"rgba(5,150,105,0.08)","UZUM MKO":"rgba(234,88,12,0.08)"};
const MARKER_COLORS={"M1":"#7c3aed","M2":"#ea580c","M3":"#2563eb","M4":"#059669"};
const M4_COLORS=["#7c3aed","#2563eb","#60a5fa","#f59e0b","#ea580c","#059669","#f87171","#a78bfa","#38bdf8","#fbbf24","#34d399"];

const MarkersPage=({setPage})=>{
  const[weekFrom,setWeekFrom]=useState(null);
  const[weekTo,setWeekTo]=useState(null);
  const[data,setData]=useState(null);
  const[loading,setLoading]=useState(true);
  const[err,setErr]=useState(null);
  const[typeFilter,setTypeFilter]=useState("Все");
  const[showAllBatches,setShowAllBatches]=useState(false);
  const[showAllCrit,setShowAllCrit]=useState(false);
  const[showAllAtt,setShowAllAtt]=useState(false);
  const[m4Mode,setM4Mode]=useState("pcs");
  const[maxWeek,setMaxWeek]=useState(21);

  // find max week on mount
  useEffect(()=>{
    sbFetch("pl_batch_cache?select=week_num&year=eq.2026&order=week_num.desc&limit=1").then(r=>{
      if(r&&r[0]){
        const mw=r[0].week_num;
        setMaxWeek(mw);
        setWeekFrom(1);
        setWeekTo(mw);
      } else { setWeekFrom(1);setWeekTo(20); }
    }).catch(()=>{ setWeekFrom(20);setWeekTo(20); });
  },[]);

  useEffect(()=>{
    if(weekFrom==null||weekTo==null)return;
    setLoading(true);setErr(null);
    sbRpc("get_markers",{p_year:2026,p_week_from:weekFrom,p_week_to:weekTo})
      .then(d=>{setData(d);setLoading(false);setShowAllBatches(false);setShowAllCrit(false);setShowAllAtt(false);})
      .catch(e=>{setErr(e.message);setLoading(false);});
  },[weekFrom,weekTo]);

  const fv=(n)=>{if(n==null||isNaN(n))return"—";return Number(n).toLocaleString('ru-RU',{maximumFractionDigits:0}).replace(/,/g,' ')};
  const fv2=(n)=>{if(n==null||isNaN(n))return"—";return Number(n).toLocaleString('ru-RU',{maximumFractionDigits:2}).replace(/,/g,' ')};
  const fm=(n,d=2)=>n!=null&&!isNaN(n)?Number(n).toFixed(d).replace('.',','):"—";

  const weekOpts=Array.from({length:maxWeek},(_, i)=>({value:String(i+1),label:`W${i+1}`}));
  const isRange=weekFrom!==weekTo;
  const periodLabel=isRange?`Недели ${weekFrom}–${weekTo}`:`Неделя ${weekTo}`;
  const s=data?.summary;
  const mk=data?.markers;
  const bt=data?.by_type||{};
  const batches=data?.batches||[];
  const allAlerts=[...(mk?.m1?.alerts||[]).map(a=>({...a,marker:'M1'})),...(mk?.m2?.alerts||[]).map(a=>({...a,marker:'M2'})),...(mk?.m3?.alerts||[]).map(a=>({...a,marker:'M3'}))];
  const critAlerts=allAlerts.filter(a=>a.severity==='critical');
  const attAlerts=allAlerts.filter(a=>a.severity==='attention');
  const totalAlertsCrit=critAlerts.length;
  const totalAlertsAtt=attAlerts.length;

  // filter batches by type
  const filteredBatches=typeFilter==="Все"?batches:batches.filter(b=>b.type===typeFilter);
  const shownBatches=showAllBatches?filteredBatches:filteredBatches.slice(0,50);

  // marker severity for a cell
  const cellSev=(val,marker)=>{
    if(val==null)return null;
    const avg_by_type_key=marker==='m1'?'m1':'m2'; // simplified
    // find alert for this batch+marker
    const alert=allAlerts.find(a=>a.batch===val.batch&&a.marker===marker);
    return alert?alert.severity:null;
  };

  const getSev=(batch,biz_type,field,avgByType)=>{
    if(field==null||!avgByType||!avgByType[biz_type])return"norm";
    const avg=avgByType[biz_type];
    if(avg<=0)return"norm";
    const ratio=field/avg;
    if(ratio>1.20)return"critical";
    if(ratio>1.10)return"attention";
    return"norm";
  };

  const sevStyle=(sev)=>{
    if(sev==="critical")return{background:"rgba(220,38,38,0.12)",color:"var(--danger)",fontWeight:600};
    if(sev==="attention")return{background:"rgba(234,179,8,0.12)",color:"#b45309",fontWeight:600};
