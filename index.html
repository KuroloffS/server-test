  pl_expenses_ucb:{icon:"📉",color:"var(--orange)",title:"P&L: Расходы UZUM CB"},
  pl_weekly:{icon:"📈",color:"#7c3aed",title:"P&L: Еженедельный отчёт"},
  markers:{icon:"🎯",color:"var(--danger)",title:"Маркеры"}
};
const LogicPage=({setPage})=>{
  const[data,setData]=useState([]);
  const[loading,setLoading]=useState(true);
  const[err,setErr]=useState(null);
  const[expanded,setExpanded]=useState({});
  const[showHistory,setShowHistory]=useState({});

  useEffect(()=>{
    sbFetch('calc_logic_versions?select=*&order=section.asc,version.desc')
      .then(d=>{setData(d||[]);setLoading(false)})
      .catch(e=>{setErr(e.message);setLoading(false)});
  },[]);

  const tog=(k)=>setExpanded(p=>({...p,[k]:!p[k]}));
  const togH=(k)=>setShowHistory(p=>({...p,[k]:!p[k]}));

  // Group by section, current version first
  const sections=useMemo(()=>{
    const map={};
    data.forEach(r=>{
      if(!map[r.section])map[r.section]={current:null,history:[]};
      if(r.is_current)map[r.section].current=r;
      else map[r.section].history.push(r);
    });
    // If no explicit current, take highest version
    Object.values(map).forEach(s=>{
      if(!s.current&&s.history.length){
        s.current=s.history.shift();
      }
    });
    return map;
  },[data]);

  const sectionOrder=["pricing","costing","volumes","pl_revenue","pl_expenses_cn","pl_expenses_ucb","pl_weekly","markers"];

  return h('div',{style:{background:"var(--bg)",minHeight:"100vh"}},
    h(Nav,{page:"logic",setPage}),
    h('div',{style:{maxWidth:1000,margin:"0 auto",padding:"32px 24px"}},
      h('div',{style:{marginBottom:28}},
        h('div',{style:{fontSize:12,color:"var(--muted)",marginBottom:4,letterSpacing:"0.06em",textTransform:"uppercase"}},"Документация"),
        h('h1',{style:{fontSize:24,fontWeight:700,color:"var(--text)",marginBottom:6}},"Логика расчётов"),
        h('p',{style:{fontSize:14,color:"var(--muted)",lineHeight:1.6}},"Описание формул и источников данных для каждого раздела портала. Все изменения логики фиксируются с версионностью.")
      ),
      loading&&h(Spinner),
      err&&h(ErrBox,{msg:err}),
      !loading&&!err&&sectionOrder.map(sec=>{
        const s=sections[sec];
        if(!s||!s.current)return null;
        const c=s.current;
        const meta=SECTION_META[sec]||{icon:"📄",color:"var(--muted)",title:sec};
        const isOpen=expanded[sec];
        return h('div',{key:sec,style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:14,marginBottom:12,boxShadow:"var(--shadow)",overflow:"hidden"}},
          // Header - always visible
          h('div',{onClick:()=>tog(sec),style:{padding:"18px 22px",cursor:"pointer",display:"flex",alignItems:"center",gap:14,transition:"background 0.15s",":hover":{background:"var(--s2)"}}},
            h('div',{style:{width:40,height:40,borderRadius:10,background:meta.color+"15",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}},meta.icon),
            h('div',{style:{flex:1}},
              h('div',{style:{fontSize:15,fontWeight:700,color:"var(--text)"}},c.title),
              h('div',{style:{fontSize:12,color:"var(--muted)",marginTop:2}},meta.title+" · v"+c.version)
            ),
            h('div',{style:{display:"flex",alignItems:"center",gap:8}},
              h('span',{style:{fontSize:10,color:"var(--muted)",fontFamily:"'JetBrains Mono',monospace"}},new Date(c.created_at).toLocaleDateString('ru-RU')),
              h('span',{style:{fontSize:12,color:"var(--muted)",transform:isOpen?"rotate(90deg)":"none",transition:"transform 0.2s"}},"▶")
            )
          ),
          // Expanded details
          isOpen&&h('div',{style:{padding:"0 22px 20px",borderTop:"1px solid var(--border)"}},
            // Description
            h('div',{style:{marginTop:16}},
              h('div',{style:{fontSize:11,fontWeight:600,color:"var(--muted)",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6}},"ОПИСАНИЕ"),
              h('div',{style:{fontSize:13,color:"var(--text2)",lineHeight:1.7,whiteSpace:"pre-wrap"}},c.description)
            ),
            // Formula
            c.formula&&h('div',{style:{marginTop:14}},
              h('div',{style:{fontSize:11,fontWeight:600,color:"var(--muted)",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6}},"ФОРМУЛЫ"),
              h('div',{style:{background:"var(--s2)",border:"1px solid var(--border)",borderRadius:8,padding:"10px 14px",fontSize:12,fontFamily:"'JetBrains Mono',monospace",color:"var(--text)",lineHeight:1.6,whiteSpace:"pre-wrap"}},c.formula)
            ),
            // SQL Source
            c.sql_source&&h('div',{style:{marginTop:14}},
              h('div',{style:{fontSize:11,fontWeight:600,color:"var(--muted)",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6}},"ИСТОЧНИК (SQL)"),
              h('div',{style:{background:"var(--s2)",border:"1px solid var(--border)",borderRadius:8,padding:"10px 14px",fontSize:12,fontFamily:"'JetBrains Mono',monospace",color:"var(--purple)",lineHeight:1.5}},c.sql_source)
            ),
            // Tables used
            c.tables_used&&c.tables_used.length>0&&h('div',{style:{marginTop:14}},
              h('div',{style:{fontSize:11,fontWeight:600,color:"var(--muted)",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6}},"ТАБЛИЦЫ"),
              h('div',{style:{display:"flex",gap:4,flexWrap:"wrap"}},
                ...c.tables_used.map(t=>h('span',{key:t,className:"chip"},t))
              )
            ),
            // Change note
            c.change_note&&h('div',{style:{marginTop:14,padding:"8px 12px",background:"rgba(37,99,235,0.06)",border:"1px solid rgba(37,99,235,0.15)",borderRadius:8}},
              h('span',{style:{fontSize:11,fontWeight:600,color:"var(--blue)"}},"📝 "),
              h('span',{style:{fontSize:12,color:"var(--text2)"}},c.change_note)
            ),
            // Version history
            s.history.length>0&&h('div',{style:{marginTop:14}},
              h('button',{onClick:()=>togH(sec),style:{fontSize:12,fontWeight:600,color:"var(--muted)",background:"none",border:"none",padding:0,cursor:"pointer",display:"flex",alignItems:"center",gap:4}},
                h('span',{style:{transform:showHistory[sec]?"rotate(90deg)":"none",transition:"transform 0.2s",fontSize:10}},"▶"),
                "История версий ("+s.history.length+")"
              ),
              showHistory[sec]&&h('div',{style:{marginTop:8,borderLeft:"2px solid var(--border)",paddingLeft:14}},
                ...s.history.map(v=>h('div',{key:v.version,style:{marginBottom:10,fontSize:12}},
                  h('div',{style:{fontWeight:600,color:"var(--text)"}},"v"+v.version+" · "+new Date(v.created_at).toLocaleDateString('ru-RU')),
                  v.change_note&&h('div',{style:{color:"var(--muted)",marginTop:2}},v.change_note),
                  h('div',{style:{color:"var(--text2)",marginTop:4,fontSize:11,lineHeight:1.5}},v.description.substring(0,200)+(v.description.length>200?"...":""))
                ))
              )
            )
          )
        );
      })
    )
  );
};

// ── APP ────────────────────────────────────────────────────────
const App=()=>{
  const[page,setPage]=useState("home");
  return h(Fragment,null,
    page==="home"&&h(HomePage,{setPage}),
    page==="pricing"&&h(PricingPage,{setPage}),
    page==="costing"&&h(CostingPage,{setPage}),
    page==="volumes"&&h(VolumesPage,{setPage}),
    page==="revenue"&&h(RevenuePage,{setPage}),
    page==="upload"&&h(UploadPage,{setPage}),
    page==="pl"&&h(PLPage,{setPage}),
    page==="markers"&&h(MarkersPage,{setPage}),
    page==="logic"&&h(LogicPage,{setPage})
  );
};
try{
  createRoot(document.getElementById("root")).render(h(App));
}catch(err){
  document.getElementById("root").innerHTML='<div style="padding:40px;color:red;font-family:monospace">'+err.message+'</div>';
}
</script>
</body>
</html>
